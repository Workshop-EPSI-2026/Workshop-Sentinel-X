# Sentinel-X — intégration continue : rapide, sans secret, adaptée à un projet d'une semaine.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Aucun secret dans le dépôt (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --redact --verbose --exit-code 1

  compose:
    name: docker-compose valide
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la composition (tous profils)
        working-directory: infra
        run: |
          cp .env.example .env
          touch mosquitto/passwd
          docker compose --profile app --profile ai config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.linux.yml --profile app --profile ai config --quiet
      - name: Aucun port publié en dehors de 443 et 8883
        working-directory: infra
        run: |
          cp .env.example .env
          touch mosquitto/passwd
          PORTS=$(docker compose -f docker-compose.yml -f docker-compose.linux.yml --profile app --profile ai \
            config --format json | jq -r '.services[].ports[]?.published' | sort -u | tr '\n' ' ')
          echo "Ports publiés : $PORTS"
          for p in $PORTS; do
            case "$p" in 443|8883) ;; *) echo "::error::Port $p publié : interdit (seuls 443 et 8883)"; exit 1;; esac
          done

  python:
    name: Python (lint et verrous)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install "ruff==0.16.3" "uv==0.11.7"
      - name: ruff (règles communes de ruff.toml)
        run: ruff check api ai tools security
      - name: Verrous de dépendances à jour
        run: python tools/lock_deps.py --check

  brain:
    name: Sentinel Brain (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install -r ai/anomaly/requirements.txt
      - name: Tests unitaires et scénarios simulés
        run: python -m unittest discover -s ai/anomaly/tests -v

  api:
    name: API (tests de sécurité et de contrat)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: sentinel_test
        ports: ["55440:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SENTINEL_TEST_DATABASE_URL: postgresql://sentinel:testpass@127.0.0.1:55440/sentinel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install -r api/requirements.txt "httpx==0.28.1"
      - name: Refus sans jeton, validation, WebSocket, messages MQTT invalides
        run: python -m unittest discover -s api/tests -v

  notify:
    name: Notifications (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Règles des annonces, caméra masquée / rétablie, mails
        run: python -m unittest discover -s ai/notify/tests -v

  firmware:
    name: Firmware ESP32-S3 (compilation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: echo "present=$([ -f firmware/platformio.ini ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - if: steps.check.outputs.present == 'true'
        name: Compiler
        run: |
          pip install platformio
          cp firmware/include/secrets.example.h firmware/include/secrets.h
          [ -f firmware/include/ca_cert.h ] || echo 'static const char CA_CERT[] PROGMEM = "";' > firmware/include/ca_cert.h
          pio run -d firmware
      - if: steps.check.outputs.present != 'true'
        run: 'echo "Pas encore de firmware/platformio.ini, étape ignorée."'

  dashboard:
    name: Dashboard (types, build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: echo "present=$([ -f dashboard/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - if: steps.check.outputs.present == 'true'
        working-directory: dashboard
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          npm test
      - if: steps.check.outputs.present != 'true'
        run: 'echo "Pas encore de dashboard/package.json, étape ignorée."'
