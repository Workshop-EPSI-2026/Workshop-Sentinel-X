# Sentinel-X v3 — tâches du plan d'équipe (source unique du Kanban)
# Lu par tools/bootstrap_github.py : création des issues, puis --sync pour mettre à jour titres et contenus.
# Pour ajouter une tâche en cours de semaine : utiliser plutôt le formulaire d'issue « Tâche ».
jalons:
- titre: Lundi
  description: 'En groupe, maintenant — Tout le monde ensemble. Objectif : décisions prises et schémas prêts pour la validation
    coach.'
- titre: Mardi
  description: 'Production — Objectif du soir : une vraie mesure de l’ESP affichée sur le dashboard servi par le PC serveur,
    vision branchée, décision go / no-go, boîtier en impression.'
- titre: Mercredi
  description: Intégration globale — Tous les blocs reliés. Captures d’écran pour la vidéo avant midi.
- titre: Jeudi
  description: Gel du code, pentest et rendus — Code gelé le matin. Pentest l’après-midi. Tous les livrables numériques déposés
    le soir.
- titre: Vendredi
  description: Soutenance — Prototype déposé au myDiL le matin, passage de 10 minutes chrono.
