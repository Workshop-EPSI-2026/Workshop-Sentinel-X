  description: Intégration globale — Tous les blocs reliés. Captures d’écran pour la vidéo avant midi.
- titre: Jeudi
  description: Gel du code, pentest et rendus — Code gelé le matin. Pentest l’après-midi. Tous les livrables numériques
    déposés le soir.
- titre: Vendredi
  description: Soutenance — Prototype déposé au myDiL le matin, passage de 10 minutes chrono.
