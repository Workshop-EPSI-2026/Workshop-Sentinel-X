# =============================================================================
#  Sentinel-X v2 — Stack serveur (PC serveur Windows 11, Docker Desktop WSL2)
#  Le même fichier tourne tel quel sur un hôte Linux (amd64 ou arm64).
#
#  Démarrage :   cd infra && copy .env.example .env  (puis remplir .env)
#                docker compose up -d
#
#  Profils (variable COMPOSE_PROFILES dans .env) :
#    (aucun)   -> mosquitto + postgres          (lundi : socle)
#    app       -> + api + nginx (dashboard)     (dès que l'API existe)
#    ai        -> + anomaly (Sentinel Brain)
#    vision    -> + vision en conteneur : hôte Linux uniquement (/dev/video0).
#                 Sous Windows, Docker Desktop n'accède pas à la webcam : la vision
#                 tourne directement sur le PC (ai/vision/run-windows.ps1).
#
#  MQTT : 8883 = boîtiers (publié), 8884 = services (interne, jamais publié).
#  Fichier Mosquitto choisi par MOSQUITTO_CONF : tls (mardi) puis mtls (TLS mutuel).
#
#  Règles de sécurité appliquées partout :
#    - seuls 443 (HTTPS/WSS) et 8883 (MQTTS) sont publiés sur l'hôte
#      (Docker contourne le pare-feu de l'hôte : ne JAMAIS ajouter d'autres "ports:")
#    - base de données sur un réseau interne, jamais exposée
#    - conteneurs non root, no-new-privileges, capabilities retirées
#    - limites mémoire : total visé < 3 Go avec YOLO
# =============================================================================

name: sentinel-x

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:

  # ---------------------------------------------------------------- MQTT ----
  mosquitto:
    <<: *hardening
    image: eclipse-mosquitto:2.0
    container_name: snx-mosquitto
    user: "1883:1883"
    group_add:
      - "${CERTS_GID:-2000}"          # lecture de la clé TLS (voir security/README.md)
    read_only: true
    ports:
      - "8883:8883"                   # MQTTS — seul port MQTT publié
    volumes:
      - ./mosquitto/${MOSQUITTO_CONF:-mosquitto.tls.conf}:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/aclfile:/mosquitto/config/aclfile:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ../security/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log  # partagé en lecture seule avec Sentinel Brain
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8884 || nc -z localhost 1883"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 64m

  # ----------------------------------------------------------- PostgreSQL ---
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    container_name: snx-postgres
    cap_add:                          # nécessaires au script d'entrée officiel
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    command: >
      postgres
      -c shared_buffers=64MB
      -c max_connections=30
      -c work_mem=4MB
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data                          # réseau interne : aucun accès depuis l'extérieur
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m

  # ------------------------------------------------------------------ API ---
  api:
    <<: *hardening
    profiles: ["app"]
    build: ../api
    image: sentinel-x/api:local
    container_name: snx-api
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel}
      MQTT_HOST: mosquitto
      MQTT_PORT: ${MQTT_PORT:-8884}
      MQTT_TLS: ${MQTT_TLS:-true}
      MQTT_CA: /certs/ca.crt
      MQTT_USER: api
      MQTT_PASSWORD: ${MQTT_API_PASSWORD:?définir MQTT_API_PASSWORD dans .env}
      API_KEY: ${API_KEY:?définir API_KEY dans .env}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?définir OPERATOR_TOKEN dans .env}
      SITE_PROFILE: /config/site.yml
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      VISION_HEALTH_URL: ${VISION_HEALTH_URL:-http://host.docker.internal:8001/health}   # vision lancée sur le PC
    volumes:
      - ../security/certs/ca.crt:/certs/ca.crt:ro
      - ../config/${SITE_PROFILE_FILE:-site.example.yml}:/config/site.yml:ro   # profil initial
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 256m

  # ------------------------------------------- Reverse proxy + dashboard ---
  nginx:
    <<: *hardening
    profiles: ["app"]
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: snx-nginx
    group_add:
      - "${CERTS_GID:-2000}"
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "443:8443"                    # HTTPS + WSS — seul port web publié
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../dashboard/dist:/usr/share/nginx/html:ro   # build fait sur un laptop (npm run build)
      - ../security/certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # vision lancée sur le PC (hors Docker)
    networks:
      - app
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://localhost:8443/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m

  # ------------------------------------------------------------ IA vision ---
  vision:
    <<: *hardening
    profiles: ["vision"]               # hôte Linux uniquement (voir en-tête)
    build: ../ai/vision
    image: sentinel-x/vision:local
    container_name: snx-vision
    group_add:
      - video                         # accès webcam
    devices:
      - "${CAMERA_DEVICE:-/dev/video0}:/dev/video0"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY}
      MODEL_PATH: /models/${VISION_MODEL:-yolov8n_ncnn_model}
      SITE_PROFILE: /config/site.yml   # zone, confiance, luminosité (mise à jour via l'API)
    volumes:
      - ../ai/vision/models:/models:ro
      - ../config/${SITE_PROFILE_FILE:-site.example.yml}:/config/site.yml:ro
    networks:
      - app
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health',timeout=3).status==200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 1536m
    cpus: 3.0

  # ------------------------------------------- Sentinel Brain (détection) ---
  anomaly:
    <<: *hardening
    profiles: ["ai"]
    build: ../ai/anomaly
    image: sentinel-x/anomaly:local
    container_name: snx-anomaly
    read_only: true
    tmpfs:
      - /tmp
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: ${MQTT_PORT:-8884}
      MQTT_TLS: ${MQTT_TLS:-true}
      MQTT_CA: /certs/ca.crt
      MQTT_USER: anomaly
      MQTT_PASSWORD: ${MQTT_ANOMALY_PASSWORD:?définir MQTT_ANOMALY_PASSWORD dans .env}
      API_URL: http://api:8000
      API_KEY: ${API_KEY}
      MODEL_DIR: /models
      SITE_PROFILE: /config/site.yml
      MOSQUITTO_LOG: /mosquitto-log/mosquitto.log   # accès refusés -> signaux cyber
    volumes:
      - ../security/certs/ca.crt:/certs/ca.crt:ro
      - ../config/${SITE_PROFILE_FILE:-site.example.yml}:/config/site.yml:ro
      - mosquitto-log:/mosquitto-log:ro
      - brain-models:/models          # modèles réentraînés en continu (persistants)
    networks:
      - app
    depends_on:
      mosquitto:
        condition: service_healthy
      api:
        condition: service_started
    mem_limit: 512m

networks:
  app:                                # services applicatifs
  data:
    internal: true                    # PostgreSQL : pas de route vers l'extérieur

volumes:
  mosquitto-data:
  mosquitto-log:
  pg-data:
  brain-models:
