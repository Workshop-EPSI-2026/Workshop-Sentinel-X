# =============================================================================
#  Sentinel-X — stack serveur, Option B : PC portable sous Windows 11 + Docker Desktop.
#  Le même fichier tourne sans modification sous Linux et sur un Raspberry Pi 5 (arm64) :
#  ajouter alors docker-compose.linux.yml pour mettre aussi la vision dans un conteneur.
#
#  Démarrage (PowerShell, dossier infra) :   copy .env.example .env   (puis remplir .env)
#                                            docker compose up -d
#  Ou tout-en-un depuis la racine :          .\tools\demarrer.ps1
#
#  Profils (variable COMPOSE_PROFILES dans .env) :
#    (aucun)   -> mosquitto + postgres          (socle)
#    app       -> + api + nginx (dashboard)     (dès que l'API existe)
#    ai        -> + anomaly (Sentinel Brain)
#  La vision tourne hors Docker sous Windows : Docker Desktop ne donne pas accès à la webcam.
#  Elle est lancée par tools\demarrer.ps1 (ou : python -m app.main, dans ai/vision).
#
#  MQTT : 8883 = boîtiers et vision (publié), 8884 = services Docker (interne, jamais publié).
#  Fichier Mosquitto choisi par MOSQUITTO_CONF : tls puis mtls (TLS mutuel).
#
#  Règles de sécurité appliquées partout :
#    - seuls 443 (HTTPS/WSS) et 8883 (MQTTS) sont publiés sur l'hôte ; le pare-feu Windows ne les
#      ouvre qu'au réseau du point d'accès (tools\serveur-pc.ps1). Ne JAMAIS ajouter d'autres "ports:".
#    - base de données sur un réseau interne, jamais exposée
#    - conteneurs non root, no-new-privileges, capabilities retirées, système de fichiers en lecture seule
#    - limites mémoire : la stack complète tient sous 1,5 Go (portable sur un Raspberry Pi)
# =============================================================================

name: sentinel-x

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:

  # ---------------------------------------------------------------- MQTT ----
  mosquitto:
    <<: *hardening
    image: eclipse-mosquitto:2.0
    container_name: snx-mosquitto
    user: "1883:1883"
    group_add:
      - "${CERTS_GID:-2000}"          # Linux / Raspberry : lecture de la clé TLS (voir security/README.md)
    read_only: true
    ports:
      - "8883:8883"                   # MQTTS — seul port MQTT publié (boîtiers et vision)
    volumes:
      - ./mosquitto/${MOSQUITTO_CONF:-mosquitto.tls.conf}:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/aclfile:/mosquitto/config/aclfile:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ../security/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log  # partagé en lecture seule avec Sentinel Brain (accès refusés)
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8884 || nc -z localhost 1883"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 64m

  # ----------------------------------------------------------- PostgreSQL ---
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    container_name: snx-postgres
    cap_add:                          # nécessaires au script d'entrée officiel
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      TZ: Europe/Paris
    command: >
      postgres
      -c shared_buffers=64MB
      -c max_connections=30
      -c work_mem=4MB
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro   # réglages éventuels ; le schéma est créé par l'API
    networks:
      - data                          # réseau interne : aucun accès depuis l'extérieur
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m

  # ------------------------------------------------------------------ API ---
  api:
    <<: *hardening
    profiles: ["app"]
    build: ../api
    image: sentinel-x/api:local
    container_name: snx-api
    read_only: true
    tmpfs:
      - /tmp
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel}
      MQTT_HOST: mosquitto
      MQTT_PORT: ${MQTT_PORT:-8884}
      MQTT_TLS: ${MQTT_TLS:-true}
      MQTT_CA: /certs/ca.crt
      MQTT_USER: api
      MQTT_PASSWORD: ${MQTT_API_PASSWORD:?définir MQTT_API_PASSWORD dans .env}
      API_KEY: ${API_KEY:?définir API_KEY dans .env}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?définir OPERATOR_TOKEN dans .env}
      SITE_PROFILE: /config/site.yml
      WEBHOOK_URL: ${WEBHOOK_URL:-}
    volumes:
      - ../security/certs:/certs:ro
      - ../config/${SITE_PROFILE_FILE:-site.example.yml}:/config/site.yml:ro   # profil initial
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 256m

  # ------------------------------------------- Reverse proxy + dashboard ---
  nginx:
    <<: *hardening
    profiles: ["app"]
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: snx-nginx
    group_add:
      - "${CERTS_GID:-2000}"
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755   # conf générée au démarrage depuis templates/ (uid 101 = nginx ; Docker Desktop crée sinon le tmpfs en root 775)
    ports:
      - "443:8443"                    # HTTPS + WSS — seul port web publié
    environment:
      # Flux vidéo : la vision tourne sur le PC Windows (hors Docker) -> host.docker.internal:8001.
      # docker-compose.linux.yml le remplace par le conteneur vision (vision:8001).
      VISION_UPSTREAM: ${VISION_UPSTREAM:-host.docker.internal:8001}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # déjà défini par Docker Desktop ; requis sous Linux
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ../dashboard/dist:/usr/share/nginx/html:ro   # npm run build (dashboard/)
      - ../security/certs:/etc/nginx/certs:ro
    networks:
      - app
    depends_on:
      - api
    healthcheck:
      # 127.0.0.1 et non localhost : dans l'image Alpine, localhost désigne d'abord ::1 (IPv6), où nginx n'écoute pas
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1:8443/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m

  # ------------------------------------------- Sentinel Brain (détection) ---
  anomaly:
    <<: *hardening
    profiles: ["ai"]
    build: ../ai/anomaly
    image: sentinel-x/anomaly:local
    container_name: snx-anomaly
    user: "1883:1883"               # même utilisateur que Mosquitto : seul moyen de lire son journal (accès refusés)
    read_only: true
    tmpfs:
      - /tmp
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: ${MQTT_PORT:-8884}
      MQTT_TLS: ${MQTT_TLS:-true}
      MQTT_CA: /certs/ca.crt
      MQTT_USER: anomaly
      MQTT_PASSWORD: ${MQTT_ANOMALY_PASSWORD:?définir MQTT_ANOMALY_PASSWORD dans .env}
      API_URL: http://api:8000
      API_KEY: ${API_KEY}
      SITE_PROFILE: /config/site.yml
      MOSQUITTO_LOG: /mosquitto-log/mosquitto.log   # accès refusés -> signaux cyber
      TZ: Europe/Paris
    volumes:
      - ../security/certs:/certs:ro     # dossier entier : un fichier absent créerait un dossier « ca.crt » (Docker Desktop)
      - ../config/${SITE_PROFILE_FILE:-site.example.yml}:/config/site.yml:ro
      - mosquitto-log:/mosquitto-log:ro
    networks:
      - app
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/brain.alive')<30 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m

networks:
  app:                                # services applicatifs
  data:
    internal: true                    # PostgreSQL : pas de route vers l'extérieur

volumes:
  mosquitto-data:
  mosquitto-log:
  pg-data:
