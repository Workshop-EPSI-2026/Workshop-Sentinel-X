# Sentinel-X — Reverse proxy HTTPS (image nginx-unprivileged, écoute 8443 -> publié en 443)
# Le bloc server est dans templates/sentinel.conf.template : l'image le copie dans conf.d au démarrage
# en remplaçant ${VISION_UPSTREAM} (PC Windows : host.docker.internal:8001 ; Linux : vision:8001).
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 512; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  # DNS interne Docker : résolution à la requête, nginx démarre même si un service est absent
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Limitation de débit de l'API (anti-DoS applicatif, préparé pour le pentest)
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  include /etc/nginx/conf.d/*.conf;
}
