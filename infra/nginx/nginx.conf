# Sentinel-X — Reverse proxy HTTPS (image nginx-unprivileged, écoute 8443 -> publié en 443)
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 512; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  # DNS interne Docker : résolution à la requête, nginx démarre même si un service est absent
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Limitation de débit de l'API (anti-DoS applicatif, préparé pour le pentest)
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 8443 ssl;
    http2 on;
    server_name sentinel-pi _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;

    client_max_body_size 1m;

    # Dashboard (fichiers statiques compilés)
    root /usr/share/nginx/html;
    location / { try_files $uri $uri/ /index.html; }

    # API REST
    location /api/ {
      limit_req zone=api burst=40 nodelay;
      set $api_upstream http://api:8000;
      proxy_pass $api_upstream;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    # WebSocket temps réel (WSS)
    location /ws {
      set $api_upstream http://api:8000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }

    # Flux vidéo MJPEG annoté
    location /video {
      set $vision_upstream http://vision:8001;
      proxy_pass $vision_upstream;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
    }
  }
}
