# Sentinel-X — Mosquitto TLS (dès mardi)
#   8883 : boîtiers (publié sur l'hôte), TLS + identifiants
#   8884 : services Docker (jamais publié), TLS + identifiants
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/aclfile

persistence true
persistence_location /mosquitto/data/

# stdout (rotation Docker) + fichier lu par Sentinel Brain (accès refusés = signal cyber)
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

listener 8884
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
